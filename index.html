<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110f">
<title>Fanta Riftbound</title>
<style>
:root{--bg:#07110f;--panel:#10201b;--panel2:#142820;--line:#294b40;--text:#f5f0e5;--muted:#9bb3aa;--gold:#e0b85d;--red:#df7068;--green:#67d6a4;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--text);background:radial-gradient(circle at 15% -10%,#4a3d1c55,transparent 38rem),linear-gradient(#0b1714,#07110f);min-height:100vh}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:24px;padding:14px clamp(16px,4vw,56px);background:#07110fe9;border-bottom:1px solid #d9af5133;backdrop-filter:blur(15px)}.brand{border:0;background:0;color:var(--gold);font:700 18px Georgia;cursor:pointer}.brand b{color:var(--text)}nav{display:flex;gap:6px;flex:1}nav button{border:0;background:transparent;color:var(--muted);padding:9px 11px;border-radius:8px;cursor:pointer}nav button:hover,nav button.on{color:var(--text);background:#ffffff0a}.auth{display:flex;align-items:center;gap:10px}.chip{font-size:12px;color:var(--muted)}.btn{border:1px solid var(--gold);background:linear-gradient(#e5bd65,#bd903e);color:#19130b;font-weight:800;border-radius:9px;padding:10px 15px;cursor:pointer}.btn.alt{background:transparent;color:var(--text);border-color:var(--line)}.btn.danger{background:transparent;color:#ffb7b0;border-color:#8b4742}.btn:disabled{opacity:.45;cursor:not-allowed}main{width:min(1180px,calc(100% - 30px));margin:auto;padding:42px 0 100px}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1,h2{font-family:Georgia,serif;font-weight:500}h1{font-size:clamp(42px,7vw,78px);line-height:.95;margin:12px 0 20px}h2{font-size:30px;margin:0 0 14px}.lede{max-width:700px;color:var(--muted);font-size:17px;line-height:1.6}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;min-height:460px}.card,.panel{border:1px solid var(--line);background:linear-gradient(160deg,#172a23dd,#0b1714dd);padding:20px}.heroCard{min-height:320px;position:relative;overflow:hidden;border-color:#d8ad5855}.heroCard:after{content:"";position:absolute;width:260px;height:260px;border:1px solid #d8ad5833;border-radius:50%;right:-80px;top:-60px}.rank{font:64px Georgia;color:var(--gold)}.mini{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #ffffff12;padding:11px 0;color:var(--muted)}.mini b{color:var(--text)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 34px}.stat{border:1px solid var(--line);padding:17px;background:#0e1c18}.stat strong{display:block;font:28px Georgia;color:var(--gold)}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.input,.select{border:1px solid var(--line);background:#08130f;color:var(--text);padding:11px 12px;border-radius:8px;outline:none}.input{min-width:220px;flex:1}.input:focus,.select:focus{border-color:var(--gold)}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pc{border:1px solid var(--line);padding:14px;background:#10201bcc;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.pc.sel{border-color:var(--gold);background:#d8ad5811}.pc.off{opacity:.45;cursor:not-allowed}.pc small{display:block;color:var(--muted);margin-top:4px}.cost{width:36px;height:36px;border:1px solid #d8ad5866;border-radius:50%;display:grid;place-items:center;color:var(--gold);font:18px Georgia}.builder{display:grid;grid-template-columns:1fr 340px;gap:18px}.summary{position:sticky;top:86px}.slot{border:1px dashed var(--line);padding:10px;margin:8px 0;display:flex;justify-content:space-between}.slot.full{border-style:solid}.budget{height:7px;background:#07110f;border:1px solid var(--line);margin:8px 0 16px}.budget i{display:block;height:100%;background:var(--gold)}.pill{display:inline-block;border:1px solid #d8ad5833;color:#ddd3bb;border-radius:999px;padding:4px 7px;font-size:11px;margin:2px}.table{overflow:auto;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px;border-bottom:1px solid #294b4088}th{background:#11231d;color:var(--muted);font-size:11px;text-transform:uppercase}.pts{font-weight:900;color:var(--gold)}.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.rule{border:1px solid var(--line);background:#10201b;padding:14px;display:flex;justify-content:space-between}.rule b:last-child{color:var(--gold)}.msg{padding:12px 14px;border:1px solid #df706866;background:#df706812;color:#ffc0bb;margin:12px 0}.ok{color:var(--green)}.muted{color:var(--muted)}.modalBg{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:16px}.modal{width:min(430px,100%);background:#0e1d19;border:1px solid var(--line);padding:22px}.stack{display:grid;gap:11px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.row{display:flex;gap:10px;align-items:center}.right{margin-left:auto}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.event{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}.hidden{display:none!important}@media(max-width:850px){nav{display:none}.hero,.builder,.grid2,.adminGrid{grid-template-columns:1fr}.summary{position:static}.players,.rules{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}main{padding-top:28px}}@media(max-width:520px){.players,.rules{grid-template-columns:1fr}.top{gap:10px}.chip{display:none}.hero{min-height:0}h1{font-size:46px}}
</style>
</head>
<body>
<header class="top"><button class="brand" onclick="go('home')">FANTA <b>RIFTBOUND</b></button><nav id="nav"></nav><div class="auth"><span class="chip" id="user"></span><button class="btn" id="authBtn">Accedi</button></div></header>
<main id="app"></main><div id="modal"></div>
<script>
const U='https://gmunayvayjzzyrigaesx.supabase.co',K='sb_publishable_fxZLiURzemtWXCWH2u3UKg_HHEniiMT';let D=null,route='home',pick=[],teamName='';const A=document.querySelector('#app'),M=document.querySelector('#modal');
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,method='GET',body={}){const r=await fetch(U+'/rest/v1/rpc/api_request',{method:'POST',headers:{'content-type':'application/json','apikey':K},body:JSON.stringify({p_path:path,p_method:method,p_body:body,p_token:localStorage.fr_session||null})});const x=await r.json();if(!r.ok)throw Error(x.message||'Errore di rete');if(+x.status>=400)throw Error(x.data?.error||'Errore');if(x.data?.token)localStorage.fr_session=x.data.token;if(path==='/api/auth/logout')localStorage.removeItem('fr_session');return x.data}
async function load(){D=await api('/api/bootstrap');if(D.myTeam&&!pick.length){pick=D.myTeam.players.map(x=>x.id);teamName=D.myTeam.name}sync();render()}
function current(){return (location.hash.replace('#','')||'home').split('?')[0]}
function go(r){location.hash=r}
function sync(){route=current();if(route==='admin'&&D?.user?.role!=='admin')route='home';const n=[['home','Home'],['team','Crea squadra'],['leaderboard','Classifica'],['players','Giocatori'],['rules','Punteggi']];if(D?.user?.role==='admin')n.push(['admin','Admin']);document.querySelector('#nav').innerHTML=n.map(x=>`<button class="${route===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');document.querySelector('#user').textContent=D?.user?'@'+D.user.username:'';document.querySelector('#authBtn').textContent=D?.user?'Esci':'Accedi'}
function render(){sync();({home,team,leaderboard,players,rules,admin}[route]||home)();scrollTo(0,0)}
function home(){const t=D.leaderboard[0],pop=[...D.players].sort((a,b)=>b.selections-a.selections).slice(0,5);A.innerHTML=`<section class="hero"><div><span class="eyebrow">${e(D.config.tournamentName)}</span><h1>Il fantasy game della community <span style="color:var(--gold)">Riftbound.</span></h1><p class="lede">Scegli ${D.config.teamSize} giocatori, resta entro ${D.config.budget} Goldolini e guadagna punti in base ai risultati del torneo.</p><div class="row"><button class="btn" onclick="go('team')">Crea la squadra</button><button class="btn alt" onclick="go('leaderboard')">Classifica</button></div></div><aside class="card heroCard"><div class="muted">LEADER ATTUALE</div><div class="rank">#1</div><h2>${t?e(t.name):'In attesa'}</h2>${t?`<div class="mini"><span>Punti</span><b>${t.points}</b></div><div class="mini"><span>Budget</span><b>${t.cost}/${D.config.budget} G</b></div><div>${t.players.map(p=>`<span class="pill">${e(p.name)}</span>`).join('')}</div>`:''}</aside></section><div class="stats"><div class="stat"><strong>${D.stats.teams}</strong><span>Squadre</span></div><div class="stat"><strong>${D.stats.players}</strong><span>Giocatori</span></div><div class="stat"><strong>${D.config.budget}</strong><span>Goldolini</span></div><div class="stat"><strong>${D.stats.events}</strong><span>Bonus</span></div></div><div class="grid2"><section class="panel"><span class="eyebrow">Trend</span><h2>Più scelti</h2>${pop.map((p,i)=>`<div class="mini"><span>${i+1}. ${e(p.name)}</span><b>${p.selectionPct}%</b></div>`).join('')}</section><section class="panel"><span class="eyebrow">Regole</span><h2>Come funziona</h2><div class="mini"><span>Giocatori</span><b>${D.config.teamSize}</b></div><div class="mini"><span>Budget</span><b>${D.config.budget} G</b></div><div class="mini"><span>Squadre</span><b class="${D.config.teamsLocked?'':'ok'}">${D.config.teamsLocked?'Bloccate':'Aperte'}</b></div></section></div>`}
function team(){if(!D.user){A.innerHTML=`<span class="eyebrow">La tua rosa</span><h1>Accedi per creare la squadra.</h1><p class="lede">Registrati con nome utente e password e scegli i tuoi ${D.config.teamSize} player.</p><button class="btn" onclick="auth()">Accedi / Registrati</button>`;return}const ps=pick.map(id=>D.players.find(p=>p.id===id)).filter(Boolean),spent=ps.reduce((s,p)=>s+p.cost,0),locked=D.config.teamsLocked&&D.user.role!=='admin';A.innerHTML=`<span class="eyebrow">Mercato</span><h1>Crea la tua squadra.</h1>${locked?'<div class="msg">Le squadre sono bloccate.</div>':''}<div class="builder"><section><div class="players">${D.players.map(p=>{const sel=pick.includes(p.id),off=locked||(!sel&&(pick.length>=D.config.teamSize||spent+p.cost>D.config.budget));return`<article class="pc ${sel?'sel':''} ${off?'off':''}" onclick="toggle('${p.id}',${off&&!sel})"><div><b>${e(p.name)}</b><small>${p.points} pt · ${p.selectionPct}% scelto</small></div><span class="cost">${p.cost}</span></article>`}).join('')}</div></section><aside class="panel summary"><h2>La tua rosa</h2><input id="tn" class="input" placeholder="Nome squadra" value="${e(teamName)}" ${locked?'disabled':''}><div class="mini"><span>Budget</span><b>${spent}/${D.config.budget} G</b></div><div class="budget"><i style="width:${Math.min(100,spent/D.config.budget*100)}%"></i></div>${Array.from({length:D.config.teamSize},(_,i)=>ps[i]?`<div class="slot full"><span>${i+1}. ${e(ps[i].name)} · ${ps[i].cost}G</span><button class="btn danger" onclick="toggle('${ps[i].id}',false)">×</button></div>`:`<div class="slot"><span>${i+1}. Slot libero</span></div>`).join('')}<button class="btn" style="width:100%;margin-top:10px" onclick="saveTeam()" ${locked||ps.length!==D.config.teamSize||spent>D.config.budget?'disabled':''}>${D.myTeam?'Aggiorna squadra':'Conferma squadra'}</button></aside></div>`;document.querySelector('#tn')?.addEventListener('input',x=>teamName=x.target.value)}
function toggle(id,off){if(off)return;pick=pick.includes(id)?pick.filter(x=>x!==id):[...pick,id];team()}
async function saveTeam(){teamName=document.querySelector('#tn').value.trim();if(!teamName)return alert('Inserisci il nome squadra');try{await api('/api/team','POST',{name:teamName,playerIds:pick});await load();go('leaderboard')}catch(x){alert(x.message)}}
function leaderboard(){A.innerHTML=`<span class="eyebrow">Live standings</span><h1>Classifica.</h1><div class="table"><table><thead><tr><th>#</th><th>Squadra</th><th>Giocatori</th><th>Budget</th><th>Punti</th></tr></thead><tbody>${D.leaderboard.map(t=>`<tr><td class="pts">${t.rank}</td><td><b>${e(t.name)}</b><div class="muted">${e(t.owner)}</div></td><td>${t.players.map(p=>`<span class="pill">${e(p.name)}</span>`).join('')}</td><td>${t.cost}/${D.config.budget}</td><td class="pts">${t.points}</td></tr>`).join('')}</tbody></table></div>`}
function players(){A.innerHTML=`<span class="eyebrow">Roster</span><h1>Giocatori.</h1><div class="players">${[...D.players].sort((a,b)=>b.cost-a.cost||b.points-a.points).map(p=>`<div class="pc"><div><b>${e(p.name)}</b><small>${p.points} punti · ${p.selections} scelte · ${p.selectionPct}%</small></div><span class="cost">${p.cost}</span></div>`).join('')}</div>`}
function rules(){A.innerHTML=`<span class="eyebrow">Scoring</span><h1>Punteggi.</h1><div class="rules">${D.scoringRules.map(r=>`<div class="rule"><span>${e(r.name)}</span><b>${r.type==='player_cost'?'Costo player':(r.points>0?'+':'')+r.points}</b></div>`).join('')}</div>`}
async function admin(){if(D.user?.role!=='admin')return go('home');let ev=[];try{ev=(await api('/api/admin/events')).events}catch{}A.innerHTML=`<span class="eyebrow">Control room</span><h1>Admin.</h1><div class="adminGrid"><section class="panel"><h2>Assegna punti</h2><div class="stack"><select class="select" id="ap">${D.players.map(p=>`<option value="${p.id}">${e(p.name)}</option>`).join('')}</select><select class="select" id="ar">${D.scoringRules.map(r=>`<option value="${r.id}">${e(r.name)} ${r.type==='player_cost'?'':r.points}</option>`).join('')}</select><input class="input" id="ao" type="number" placeholder="Override punti (opzionale)"><input class="input" id="an" placeholder="Nota (opzionale)"><button class="btn" onclick="addEvent()">Aggiungi evento</button></div></section><section class="panel"><h2>Configurazione</h2><div class="stack"><input class="input" id="budget" type="number" value="${D.config.budget}"><input class="input" id="ts" type="number" value="${D.config.teamSize}"><input class="input" id="tour" value="${e(D.config.tournamentName)}"><label class="row"><input id="lock" type="checkbox" ${D.config.teamsLocked?'checked':''}> Blocca squadre</label><button class="btn" onclick="saveConfig()">Salva</button></div></section><section class="panel full"><h2>Giocatori</h2><div class="table"><table><thead><tr><th>Nome</th><th>Costo</th><th>Punti</th><th>Salva</th></tr></thead><tbody>${D.players.map(p=>`<tr><td>${e(p.name)}</td><td><input class="input" style="min-width:70px;width:80px" id="c_${p.id}" type="number" value="${p.cost}"></td><td>${p.points}</td><td><button class="btn alt" onclick="cost('${p.id}')">Salva</button></td></tr>`).join('')}</tbody></table></div></section><section class="panel full"><h2>Storico eventi</h2>${ev.length?ev.map(x=>`<div class="event"><div><b>${e(x.playerName)}</b> · ${e(x.ruleName)}<div class="muted">${e(x.notes||'')}</div></div><b class="pts">${x.points>0?'+':''}${x.points}</b><button class="btn danger" onclick="delEvent('${x.id}')">Rimuovi</button></div>`).join(''):'<p class="muted">Nessun evento.</p>'}</section></div>`}
async function addEvent(){try{await api('/api/admin/events','POST',{playerId:ap.value,ruleId:ar.value,pointsOverride:ao.value,notes:an.value});await load();admin()}catch(x){alert(x.message)}}
async function delEvent(id){if(!confirm('Rimuovere evento?'))return;try{await api('/api/admin/events/'+id,'DELETE');await load();admin()}catch(x){alert(x.message)}}
async function cost(id){try{await api('/api/admin/players/'+id,'PATCH',{cost:+document.querySelector('#c_'+id).value});await load();admin()}catch(x){alert(x.message)}}
async function saveConfig(){try{await api('/api/admin/config','PATCH',{budget:+budget.value,teamSize:+ts.value,teamsLocked:lock.checked,tournamentName:tour.value});await load();admin()}catch(x){alert(x.message)}}
function auth(mode='login'){const login=mode==='login';M.innerHTML=`<div class="modalBg" onclick="if(event.target===this)M.innerHTML='' "><div class="modal"><h2>${login?'Accedi':'Registrati'}</h2><div class="tabs"><button class="btn ${login?'':'alt'}" onclick="auth('login')">Accedi</button><button class="btn ${login?'alt':''}" onclick="auth('register')">Registrati</button></div><form class="stack" onsubmit="submitAuth(event,'${mode}')"><input class="input" name="username" minlength="3" placeholder="Nome utente" required><input class="input" name="password" type="password" minlength="6" placeholder="Password" required><button class="btn">${login?'Accedi':'Crea account'}</button></form></div></div>`}
async function submitAuth(ev,mode){ev.preventDefault();const f=new FormData(ev.target);try{await api('/api/auth/'+mode,'POST',Object.fromEntries(f));M.innerHTML='';pick=[];teamName='';await load()}catch(x){alert(x.message)}}
document.querySelector('#authBtn').onclick=async()=>{if(D?.user){try{await api('/api/auth/logout','POST');pick=[];teamName='';await load();go('home')}catch(x){alert(x.message)}}else auth()};window.addEventListener('hashchange',render);(async()=>{try{await load()}catch(x){A.innerHTML=`<div class="msg">Impossibile caricare l'app: ${e(x.message)}</div>`}})();
</script>
</body></html>
