name: Deploy Fanta Riftbound to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Add team deadline countdown
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          banner = '''<div id="frCountdown" style="width:100%;padding:10px 16px;text-align:center;background:#10201b;border-bottom:1px solid #294b40;color:#f5f0e5;font:700 14px Inter,system-ui,sans-serif;letter-spacing:.02em"><span style="color:#e0b85d">Chiusura squadre:</span> <span id="frCountdownText">calcolo...</span></div>'''
          script = '''<script>
          (()=>{const deadline=new Date('2026-08-20T00:00:00+02:00').getTime();const el=()=>document.getElementById('frCountdownText');function tick(){const n=Date.now(),x=el();if(!x)return;if(n>=deadline){x.textContent='SQUADRE CHIUSE';x.style.color='#df7068';return}let d=deadline-n;const days=Math.floor(d/86400000);d%=86400000;const h=Math.floor(d/3600000);d%=3600000;const m=Math.floor(d/60000);const sec=Math.floor((d%60000)/1000);x.textContent=`${days}g ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`; }tick();setInterval(tick,1000)})();
          </script>'''
          if 'id="frCountdown"' not in s:
              s = s.replace('</header>', '</header>' + banner, 1)
              s = s.replace('</body>', script + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Add Day 2 scoring tier
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin-patch.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const ranks=['top-128','top-64','top-32','top-16','top-8','top-4','top-2','top-1'];", "const ranks=['day-2','top-128','top-64','top-32','top-16','top-8','top-4','top-2','top-1'];")
          s = s.replace("${i===7?'♛':'◆'}", "${i===8?'♛':id==='day-2'?'✦':'◆'}")
          s = s.replace('<small>solo miglior risultato</small>', "<small>${id==='day-2'?'accesso al Day 2':'solo miglior risultato'}</small>")
          s = s.replace('grid-template-columns:repeat(8,1fr)', 'grid-template-columns:repeat(9,minmax(0,1fr))')
          s = s.replace('Se un player ottiene più piazzamenti, viene assegnato soltanto il punteggio del risultato migliore.', 'Day 2 e i piazzamenti successivi non sono cumulabili: viene assegnato soltanto il punteggio del miglior risultato raggiunto.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Load admin scoring controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="admin-patch.js?v=20260813-3"></script>'
          if tag not in s:
              s = s.replace('</body>', tag + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
