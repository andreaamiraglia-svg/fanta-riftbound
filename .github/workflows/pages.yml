name: Deploy Fanta Riftbound to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Add team deadline countdown
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          banner = '''<div id="frCountdown" style="width:100%;padding:10px 16px;text-align:center;background:#10201b;border-bottom:1px solid #294b40;color:#f5f0e5;font:700 14px Inter,system-ui,sans-serif;letter-spacing:.02em"><span style="color:#e0b85d">Chiusura squadre:</span> <span id="frCountdownText">calcolo...</span></div>'''
          script = '''<script>
          (()=>{const deadline=new Date('2026-08-20T00:00:00+02:00').getTime();const el=()=>document.getElementById('frCountdownText');function tick(){const n=Date.now(),x=el();if(!x)return;if(n>=deadline){x.textContent='SQUADRE CHIUSE';x.style.color='#df7068';return}let d=deadline-n;const days=Math.floor(d/86400000);d%=86400000;const h=Math.floor(d/3600000);d%=3600000;const m=Math.floor(d/60000);const sec=Math.floor((d%60000)/1000);x.textContent=`${days}g ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`; }tick();setInterval(tick,1000)})();
          </script>'''
          if 'id="frCountdown"' not in s:
              s = s.replace('</header>', '</header>' + banner, 1)
              s = s.replace('</body>', script + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Add admin scoring controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''function players(){A.innerHTML=`<span class="eyebrow">Roster</span><h1>Giocatori.</h1><div class="players">${[...D.players].sort((a,b)=>b.cost-a.cost||b.points-a.points).map(p=>`<div class="pc"><div><b>${e(p.name)}</b><small>${p.points} punti · ${p.selections} scelte · ${p.selectionPct}%</small></div><span class="cost">${p.cost}</span></div>`).join('')}</div>`}'''
          new = '''function players(){const isAdmin=D.user?.role==='admin';A.innerHTML=`<span class="eyebrow">Roster</span><h1>Giocatori.</h1>${isAdmin?'<div class="msg" style="border-color:#e0b85d55;background:#e0b85d0d;color:#e8d5a9">Modalità admin: puoi assegnare i punteggi direttamente da questa pagina.</div>':''}<div class="players">${[...D.players].sort((a,b)=>b.cost-a.cost||b.points-a.points).map(p=>`<div class="pc"><div><b>${e(p.name)}</b><small>${p.points} punti · ${p.selections} scelte · ${p.selectionPct}%</small></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px"><span class="cost">${p.cost}</span>${isAdmin?`<button class="btn alt" style="padding:6px 9px;font-size:11px" onclick="scorePlayer('${p.id}')">Assegna punti</button>`:''}</div></div>`).join('')}</div>`}
function scorePlayer(id){if(D.user?.role!=='admin')return;const p=D.players.find(x=>x.id===id);if(!p)return;M.innerHTML=`<div class="modalBg" onclick="if(event.target===this)M.innerHTML='' "><div class="modal"><span class="eyebrow">Assegna punteggio</span><h2>${e(p.name)}</h2><form class="stack" onsubmit="submitPlayerScore(event,'${p.id}')"><select class="select" name="ruleId" required>${D.scoringRules.map(r=>`<option value="${r.id}">${e(r.name)} ${r.type==='player_cost'?'(costo player)':((r.points>0?'+':'')+r.points)}</option>`).join('')}</select><input class="input" name="pointsOverride" type="number" placeholder="Punti personalizzati (opzionale)"><input class="input" name="notes" maxlength="120" placeholder="Nota (opzionale)"><button class="btn">Conferma punteggio</button><button type="button" class="btn alt" onclick="M.innerHTML=''">Annulla</button></form></div></div>`}
async function submitPlayerScore(ev,playerId){ev.preventDefault();const f=new FormData(ev.target);try{await api('/api/admin/events','POST',{playerId,ruleId:f.get('ruleId'),pointsOverride:f.get('pointsOverride'),notes:f.get('notes')});M.innerHTML='';await load();go('players')}catch(x){alert(x.message)}}'''
          if old not in s:
              raise SystemExit('players function not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
