<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Champion of the Souls — Online Playtest</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0e12;color:#f5f7fb;font-family:system-ui,sans-serif}.box{text-align:center;padding:24px}.err{color:#ff9aa2;max-width:680px}</style></head>
<body><div class="box"><h2>Caricamento Champion of the Souls…</h2><p id="status">Connessione al server di gioco.</p></div>
<script>
(async()=>{
 const BACKEND='https://gmunayvayjzzyrigaesx.supabase.co/functions/v1/soulforge';
 try{
  const r=await fetch(BACKEND,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
  let html=await r.text(); html=html.replace("const API=location.pathname;","const API='"+BACKEND+"';");
  const fixes={'â€¢':'•','â€”':'—','â†’':'→','â€™':'’','â€¦':'…','â†‘':'↑','â†“':'↓','PrioritÃ ':'Priorità','sarÃ ':'sarà','lâ€™':'l’'};
  for(const [bad,good] of Object.entries(fixes))html=html.split(bad).join(good);
  html=html.replace('</style>',`
.sf-art{display:block;width:100%;height:auto;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.34);background:#111}
.select-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.select-card{position:relative;border-radius:14px;padding:4px;border:2px solid transparent;transition:.16s;cursor:pointer}
.select-card:hover{transform:translateY(-3px)}
.select-card.selected{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.select-check{position:absolute;right:10px;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;font-weight:900;opacity:0;transform:scale(.8);transition:.15s;z-index:3}
.select-card.selected .select-check{opacity:1;transform:scale(1)}
.hover-preview{position:fixed;z-index:90;display:none;gap:18px;align-items:flex-start;width:min(720px,92vw);padding:14px;background:rgba(15,18,24,.98);border:1px solid #4b5361;border-radius:16px;box-shadow:0 22px 70px rgba(0,0,0,.6);pointer-events:none}
.hover-preview.show{display:flex}.hover-preview img{width:280px;max-width:42vw;border-radius:14px}.hover-preview .preview-text{min-width:220px;max-width:340px;padding:8px 4px}.hover-preview h3{margin:0 0 10px;font-size:20px}.hover-preview p{margin:0;color:#e4e8ef;line-height:1.5}

.chain-lane{position:sticky;top:12px;min-height:360px}.pending-zone{border:2px dashed #3a4351;border-radius:16px;padding:10px;min-height:150px;transition:.15s;background:rgba(10,12,17,.45)}.pending-zone.dragover{border-color:#fff;background:rgba(255,255,255,.05)}
.stack-stage{display:flex;flex-direction:column;align-items:center;padding:8px 0 18px}.stack-card{width:145px;position:relative;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}.stack-card+.stack-card{margin-top:-92px}.stack-card img{width:100%;border-radius:11px}.stack-card .stack-owner{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.8);padding:3px 6px;border-radius:999px;font-size:10px}
.hand-wrap{position:relative;height:255px;margin-top:8px;overflow:visible}.hand-fan{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(780px,92%);height:230px}.hand-card{position:absolute;left:50%;bottom:0;width:145px;transform-origin:50% 115%;transition:transform .18s,filter .18s,z-index .18s;cursor:grab}.hand-card:hover{z-index:30!important;filter:brightness(1.06)}.hand-card.dragging{opacity:.42}.hand-card img{width:100%;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.38)}.hand-card.disabled{filter:grayscale(.75);opacity:.45;cursor:not-allowed}
.champ.click-attack{cursor:crosshair}.champ.click-attack:hover{box-shadow:0 0 0 2px #ffcb68 inset}.attack-target{cursor:crosshair!important}body.attack-mode .attack-target{box-shadow:0 0 0 3px #ffcb68 inset!important}.attack-arrow{position:fixed;inset:0;z-index:80;pointer-events:none}.attack-hint{position:fixed;z-index:81;left:50%;top:16px;transform:translateX(-50%);background:#171b23;border:1px solid #ffcb68;color:#ffe7aa;border-radius:999px;padding:8px 13px;font-size:12px;display:none}body.attack-mode .attack-hint{display:block}
@media(max-width:1050px){.game-grid{grid-template-columns:190px minmax(0,1fr)!important}.game-grid>.side:last-child{grid-column:1/-1}.chain-lane{position:relative}}@media(max-width:760px){.game-grid{grid-template-columns:1fr!important}.chain-lane{order:2}.hand-card{width:118px}.hand-wrap{height:215px}.hand-fan{height:195px}.hover-preview{display:none!important}}
</style>`);
  const patch="\nconst SF_ART={\"kael\": \"kael.webp\", \"lyrandel\": \"lyrandel.webp\", \"lucertola_fuoco\": \"lucertola_fuoco.webp\", \"taglio_fiammante\": \"taglio_fiammante.webp\", \"sfera_incandescente\": \"sfera_incandescente.webp\", \"corazza_esplosiva\": \"corazza_esplosiva.webp\", \"occhio_di_drago\": \"occhio_di_drago.webp\", \"mano_del_caos\": \"mano_del_caos.webp\", \"nube_di_fuoco\": \"nube_di_fuoco.webp\", \"tornado_bollente\": \"tornado_bollente.webp\", \"fendente_di_fuoco\": \"fendente_di_fuoco.webp\", \"berserk\": \"berserk.webp\", \"taglio_ninjitsu\": \"taglio_ninjitsu.webp\", \"stupido\": \"stupido.webp\", \"riflesso\": \"riflesso.webp\", \"tutto_per_la_festa\": \"tutto_per_la_festa.webp\", \"alta_marea\": \"alta_marea.webp\", \"doppia_katana\": \"doppia_katana.webp\", \"albero_della_vita\": \"albero_della_vita.webp\", \"sguardo_ninjitsu\": \"sguardo_ninjitsu.webp\", \"mille_lame\": \"mille_lame.webp\"};\nconst SF_BASE='https://raw.githubusercontent.com/andreaamiraglia-svg/fanta-riftbound/soulforge-playtest/champion-of-the-souls-carte-ottimizzate/cards/';\nlet sfHoverTimer=null,sfAttackSource=null,sfAutoPassBusy=false;\nfunction sfUrl(k){const f=SF_ART[k];return f?SF_BASE+f:''}\nfunction sfImg(k,cls=''){const u=sfUrl(k);return u?'<img class=\"sf-art '+cls+'\" data-sf=\"'+k+'\" src=\"'+u+'\" alt=\"'+k+'\" loading=\"lazy\">':''}\nfunction sfEnsurePreview(){if(document.getElementById('sfHoverPreview'))return;const d=document.createElement('div');d.id='sfHoverPreview';d.className='hover-preview';document.body.appendChild(d);const hint=document.createElement('div');hint.className='attack-hint';hint.id='sfAttackHint';hint.textContent='Scegli il bersaglio dell’attacco';document.body.appendChild(hint);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id='sfAttackArrow';svg.classList.add('attack-arrow');svg.innerHTML='<defs><marker id=\"sfArrowHead\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L0,6 L9,3 z\" fill=\"#ffcb68\"/></marker></defs><line id=\"sfAttackLine\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"0\" stroke=\"#ffcb68\" stroke-width=\"4\" marker-end=\"url(#sfArrowHead)\" opacity=\"0\"/>';document.body.appendChild(svg)}\nfunction sfShowPreview(el,id){const card=session.state?.cardDefs?.[id]||playerState(session.player)?.deckCards?.find(c=>c.id===id)||playerState(session.player)?.handCards?.find(c=>c.id===id);const box=document.getElementById('sfHoverPreview');if(!box||!card)return;box.innerHTML='<img src=\"'+sfUrl(id)+'\"><div class=\"preview-text\"><h3>'+esc(card.name)+'</h3><div class=\"tag\">'+esc(card.type||'')+' • '+speedLabel(card.speed||'base')+'</div><p>'+esc(card.text||'')+'</p></div>';const r=el.getBoundingClientRect();box.style.left=Math.max(16,Math.min(window.innerWidth-700,r.right+16))+'px';box.style.top=Math.max(16,Math.min(window.innerHeight-430,r.top-80))+'px';box.classList.add('show')}\nfunction sfHidePreview(){clearTimeout(sfHoverTimer);sfHoverTimer=null;document.getElementById('sfHoverPreview')?.classList.remove('show')}\nfunction sfBindHover(){document.querySelectorAll('[data-preview-card]').forEach(el=>{el.addEventListener('mouseenter',()=>{clearTimeout(sfHoverTimer);sfHoverTimer=setTimeout(()=>sfShowPreview(el,el.dataset.previewCard),1000)});el.addEventListener('mouseleave',sfHidePreview)})}\nrenderSelect=function(){const s=session.state,me=playerState(session.player);if(me.selected)return '<div class=\"panel\"><h2>Selezione confermata</h2><p>Hai scelto le tue 6 carte. Attendo l’altro giocatore.</p></div>';const cards=me.deckCards||[];return '<div class=\"panel\"><div class=\"select-head\"><div><h2 style=\"margin:0\">Scegli 6 carte</h2><div class=\"sub\">Clicca direttamente una carta. Lasciale il cursore sopra per 1 secondo per ingrandirla.</div></div><div><b>'+selected.size+'/6</b></div></div><div class=\"select-gallery\">'+cards.map(c=>'<div class=\"select-card '+(selected.has(c.id)?'selected':'')+'\" data-select-card=\"'+c.id+'\" data-preview-card=\"'+c.id+'\">'+sfImg(c.id)+'<div class=\"select-check\">✓</div></div>').join('')+'</div><div class=\"controls\"><button id=\"confirmSelect\" class=\"btn primary\" '+(selected.size!==6?'disabled':'')+'>Conferma 6 carte</button></div></div>'}\nchampHtml=function(c,owner,isOwn){if(!c)return'';const wounds=c.wounds||0;const attackable=isOwn&&canAttack(c)?' click-attack':'';const targetable=!isOwn&&!c.defeated?' attack-target':'';return '<div class=\"champ '+c.color+(c.defeated?' defeated':'')+attackable+targetable+'\" data-owner=\"'+owner+'\" data-champ-id=\"'+c.id+'\"><div class=\"tap '+(!c.tapped&&!c.defeated?'active':'')+'\">'+(c.defeated?'SCONFITTO':c.tapped?'TAPPATO':'ATTIVO')+'</div>'+sfImg(c.id,'champ-art')+'<h3>'+esc(c.name)+'</h3><div class=\"stats\"><span class=\"stat\">POW <b>'+c.pow+'</b></span><span class=\"stat\">HP <b>'+(c.hp-wounds)+'</b>/'+c.hp+'</span><span class=\"stat\">Danni <b>'+c.damage+'</b>/'+c.pow+'</span><span class=\"stat\">Ferite <b>'+wounds+'</b></span></div></div>'}\nmonsterHtml=function(m){return '<div class=\"monster '+m.color+' attack-target\" data-monster-uid=\"'+m.uid+'\">'+sfImg(m.cardId,'monster-art')+'<h4>'+esc(m.name)+'</h4><div class=\"meta\">Proprietario: '+esc(playerState(m.owner)?.name||'?')+'</div><div class=\"stats\" style=\"margin-top:8px\"><span class=\"stat\">POW '+m.pow+'</span><span class=\"stat\">Danni '+m.damage+'/'+m.pow+'</span></div></div>'}\nfunction sfChainVisual(){const s=session.state;let h='<div class=\"panel chain-lane\"><h3 style=\"margin-top:0\">Pending / Catena</h3><div id=\"playDropZone\" class=\"pending-zone\"><div class=\"tiny\" style=\"text-align:center;margin-bottom:8px\">Trascina qui una carta dalla mano</div><div class=\"stack-stage\">';if(!s.stack.length)h+='<div class=\"sub\">Nessuna carta in pending.</div>';else h+=s.stack.map((x,i)=>'<div class=\"stack-card\" style=\"z-index:'+(20+i)+'\"><img src=\"'+sfUrl(x.cardId)+'\"><div class=\"stack-owner\">'+esc(playerState(x.actor)?.name||'')+'</div></div>').join('');h+='</div></div>';if(s.combat)h+=combatHtml();if(s.priority)h+='<div class=\"sub\" style=\"margin-top:10px\">In attesa di <b>'+esc(playerState(s.priority)?.name||'')+'</b></div>';h+='</div>';return h}\nfunction sfHandHtml(cards){const n=cards.length;if(!n)return '<div class=\"sub\">Nessuna carta in mano.</div>';return '<div class=\"hand-wrap\"><div class=\"hand-fan\">'+cards.map((c,i)=>{const center=(n-1)/2,off=i-center,rot=off*7,x=off*82,disabled=!canCast(c);return '<div class=\"hand-card '+(disabled?'disabled':'')+'\" draggable=\"'+(!disabled)+'\" data-hand-card=\"'+c.id+'\" data-preview-card=\"'+c.id+'\" style=\"transform:translate('+x+'px,'+Math.abs(off)*5+'px) rotate('+rot+'deg);z-index:'+(10+i)+'\">'+sfImg(c.id)+'</div>'}).join('')+'</div></div>'}\nrenderMain=function(){const s=session.state,me=playerState(session.player),op=playerState(otherP());const center='<main><div class=\"panel playerzone\"><div class=\"playerinfo\"><b>'+esc(op.name)+'</b><div class=\"sub\">Mano: '+op.handCount+' • Deck: '+op.deckCount+' • Cimitero: '+op.graveCount+'</div>'+soulsHtml(op)+'</div><div class=\"champions\">'+op.champions.map(c=>champHtml(c,otherP(),false)).join('')+'</div></div><div class=\"board\"><h3>Campo dei Mostri <span class=\"sub\">('+s.board.monsters.length+')</span></h3><div class=\"monsters\">'+(s.board.monsters.length?s.board.monsters.map(monsterHtml).join(''):'<div class=\"sub\">Nessun Mostro sul campo.</div>')+'</div></div><div class=\"panel playerzone\"><div class=\"playerinfo\"><b>'+esc(me.name)+'</b><div class=\"sub\">Deck: '+me.deckCards.length+' • Cimitero: '+me.graveCards.length+' • Monster Deck: '+me.monsterDeck.length+' • Cimitero Mostri: '+me.monsterGrave.length+'</div>'+soulsHtml(me)+'</div><div class=\"champions\">'+me.champions.map(c=>champHtml(c,session.player,true)).join('')+'</div></div><div class=\"hand-title\"><h3 style=\"margin:0\">La tua mano ('+me.handCards.length+')</h3><div class=\"controls\">'+mainControls()+'</div></div>'+sfHandHtml(me.handCards)+'</main>';const log='<aside class=\"side\"><div class=\"panel\"><h3 style=\"margin-top:0\">Log</h3><div class=\"log\">'+[...s.log].reverse().map(x=>'<div>'+esc(x)+'</div>').join('')+'</div></div></aside>';return '<div class=\"game-grid\">'+sfChainVisual()+center+log+'</div>'}\nfunction sfStartAttack(champId,el){const c=playerState(session.player).champions.find(c=>c.id===champId);if(!c||!canAttack(c))return;sfAttackSource={champId,el};document.body.classList.add('attack-mode')}\nfunction sfCancelAttack(){sfAttackSource=null;document.body.classList.remove('attack-mode');const line=document.getElementById('sfAttackLine');if(line)line.setAttribute('opacity','0')}\nfunction sfUpdateArrowFromEvent(e){if(!sfAttackSource||!e)return;const r=sfAttackSource.el.getBoundingClientRect(),line=document.getElementById('sfAttackLine');if(!line)return;line.setAttribute('x1',r.left+r.width/2);line.setAttribute('y1',r.top+r.height/2);line.setAttribute('x2',e.clientX);line.setAttribute('y2',e.clientY);line.setAttribute('opacity','1')}\ndocument.addEventListener('mousemove',sfUpdateArrowFromEvent);document.addEventListener('keydown',e=>{if(e.key==='Escape')sfCancelAttack()});\nasync function sfMaybeAutoPass(){if(sfAutoPassBusy||busy||!session.state||session.state.status!=='main')return;const s=session.state;let auto=false;if(s.priority===session.player&&s.stack.length){const top=s.stack[s.stack.length-1];if(top.actor===session.player)auto=true}else if(s.priority===session.player&&s.combat&&!s.stack.length&&s.combat.initiator===session.player)auto=true;if(auto){sfAutoPassBusy=true;try{await move({type:'pass_priority'})}finally{setTimeout(()=>sfAutoPassBusy=false,120)}}}\nconst sfRenderBase=render;render=function(){sfRenderBase();sfEnsurePreview();sfBindHover();setTimeout(sfMaybeAutoPass,80)};\nconst sfBindBase=bind;bind=function(){sfBindBase();document.querySelectorAll('[data-select-card]').forEach(el=>el.onclick=()=>{const id=el.dataset.selectCard;if(selected.has(id))selected.delete(id);else if(selected.size<6)selected.add(id);render()});document.querySelectorAll('[data-hand-card]').forEach(el=>{el.addEventListener('dragstart',ev=>{if(el.classList.contains('disabled')){ev.preventDefault();return}el.classList.add('dragging');ev.dataTransfer.setData('text/plain',el.dataset.handCard);ev.dataTransfer.effectAllowed='move'});el.addEventListener('dragend',()=>el.classList.remove('dragging'));el.addEventListener('dblclick',()=>{if(!el.classList.contains('disabled'))chooseForCard(el.dataset.handCard)})});const dz=document.getElementById('playDropZone');if(dz){dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover')});dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');const id=e.dataTransfer.getData('text/plain');if(id)chooseForCard(id)})}document.querySelectorAll('.champ.click-attack').forEach(el=>el.onclick=e=>{e.stopPropagation();sfStartAttack(el.dataset.champId,el)});document.querySelectorAll('.attack-target').forEach(el=>el.onclick=e=>{if(!sfAttackSource)return;e.stopPropagation();let target=null;if(el.dataset.monsterUid)target={type:'monster',uid:el.dataset.monsterUid};else if(el.dataset.champId)target={type:'champion',player:Number(el.dataset.owner),champId:el.dataset.champId};const champId=sfAttackSource.champId;sfCancelAttack();if(target)move({type:'attack',champId,target})})}\n";
  html=html.replace('(async function init(){',patch+'\n(async function init(){');
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('status').className='err';document.getElementById('status').textContent='Errore nel caricamento: '+e.message}
})();
</script></body></html>
