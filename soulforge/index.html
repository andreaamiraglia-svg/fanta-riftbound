<body><div class="box"><h2>Caricamento Soulforge…</h2><p id="status">Connessione al server di gioco.</p></div>
<script>
(async()=>{
  const BACKEND='https://gmunayvayjzzyrigaesx.supabase.co/functions/v1/soulforge';

    if(!r.ok) throw new Error('HTTP '+r.status);
    let html=await r.text();
    html=html.replace("const API=location.pathname;","const API='"+BACKEND+"';");
    const fixes={
      'â€¢':'•','â€”':'—','â†’':'→','â€™':'’','â€¦':'…','â†‘':'↑','â†“':'↓',
      'PrioritÃ ':'Priorità','sarÃ ':'sarà','lâ€™':'l’'
    };
    for(const [bad,good] of Object.entries(fixes)) html=html.split(bad).join(good);
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('status').className='err';
    document.getElementById('status').textContent='Errore nel caricamento: '+e.message;
  }
})();
</script></body></html>
