<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Champion of the Souls — Online Playtest</title>
<style>
:root{--bg:#0c0e12;--panel:#151820;--panel2:#1d212b;--line:#303643;--text:#f5f7fb;--muted:#9ca5b5;--red:#e33636;--green:#19be66;--gold:#e6b84b;--blue:#4cb9e8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#171b24 0,#0c0e12 55%);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1280px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.brand{font-weight:900;letter-spacing:.08em;text-transform:uppercase}.sub{color:var(--muted);font-size:13px}.panel{background:rgba(21,24,32,.94);border:1px solid var(--line);border-radius:16px;padding:16px}.landing{max-width:720px;margin:8vh auto}.landing h1{font-size:40px;margin:0 0 8px}.landing-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.field{display:flex;flex-direction:column;gap:7px;margin:10px 0}.field input{background:#0e1117;color:white;border:1px solid var(--line);padding:12px;border-radius:10px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#2c3340;color:#fff;font-weight:800}.btn:hover{filter:brightness(1.08)}.btn.primary{background:#eceff4;color:#111}.btn.red{background:var(--red)}.btn.green{background:var(--green);color:#06150c}.btn.gold{background:var(--gold);color:#1c1300}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn:disabled{opacity:.4;cursor:not-allowed}.error{background:#3b171b;border:1px solid #8f3039;color:#ffd8dc;padding:10px;border-radius:10px;margin:10px 0}.notice{background:#15253a;border:1px solid #2f5683;padding:10px;border-radius:10px;color:#d8eaff}.game-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}.side{display:flex;flex-direction:column;gap:12px}.statusbar{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#131722;font-size:13px}.pill.focus{border-color:var(--gold);color:#ffe49a}.playerzone{display:flex;gap:12px;align-items:stretch}.playerinfo{width:160px;flex:0 0 160px}.souls{display:flex;gap:8px;margin-top:8px}.soul{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;border:2px solid rgba(255,255,255,.25)}.soul.red{background:#671b1b}.soul.green{background:#0b5f31}.champions{display:grid;grid-template-columns:repeat(2,minmax(170px,1fr));gap:10px;flex:1}.champ{border-radius:14px;padding:12px;border:2px solid var(--line);background:linear-gradient(160deg,#252a34,#14171e);position:relative;min-height:150px}.champ.red{border-color:#7c2929}.champ.green{border-color:#176c42}.champ.defeated{filter:grayscale(1);opacity:.45}.champ h3{margin:0 0 8px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{font-size:13px;background:#0b0e13;border:1px solid #343b48;border-radius:8px;padding:5px 8px}.tap{position:absolute;right:10px;top:10px;font-size:11px;padding:4px 7px;border-radius:999px;background:#5b2931}.active{background:#175d3b}.board{margin:12px 0;padding:14px;border:1px solid var(--line);border-radius:16px;background:rgba(8,10,14,.58)}.board h3{margin:0 0 10px}.monsters{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}.monster{border:2px solid var(--line);border-radius:12px;padding:10px;background:#151922;min-height:106px}.monster.red{border-color:#753030}.monster.green{border-color:#1a7246}.monster h4{margin:0 0 6px;font-size:14px}.monster .meta{font-size:12px;color:var(--muted)}.hand-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}.card{border:2px solid var(--line);border-radius:12px;background:#171b23;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:6px;position:relative}.card.red{border-color:#812b2b}.card.green{border-color:#147142}.card.selected{outline:3px solid #fff}.cost{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#0a0c10;border:2px solid currentColor}.card h4{margin:0;padding-right:40px}.tag{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.text{font-size:13px;line-height:1.35;color:#e4e8ef;margin-top:auto}.card-actions{display:flex;gap:6px;margin-top:8px}.chain{display:flex;flex-direction:column;gap:6px}.chainitem{background:#0f131a;border:1px solid #343a46;border-radius:8px;padding:8px;font-size:12px}.combat{border:1px solid #83572d;background:#2d2115;border-radius:10px;padding:9px;font-size:13px}.log{max-height:390px;overflow:auto;font-size:12px;line-height:1.45}.log div{padding:5px 0;border-bottom:1px solid #252a33}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.select-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modalbox{width:min(720px,100%);max-height:90vh;overflow:auto;background:#151922;border:1px solid #414957;border-radius:16px;padding:16px}.target-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.target{background:#1e2430;border:1px solid #394150;color:white;border-radius:10px;padding:10px;text-align:left}.tiny{font-size:11px;color:var(--muted)}.choice-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #343b46;border-radius:10px;padding:10px;margin:7px 0}.footer{color:#747e8e;text-align:center;font-size:11px;padding:18px}.hidden{display:none!important}@media(max-width:850px){.game-grid{grid-template-columns:1fr}.playerzone{flex-direction:column}.playerinfo{width:auto;flex:auto}.landing-grid{grid-template-columns:1fr}.champions{grid-template-columns:1fr 1fr}}
</style>
</head><body><div id="app"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal');
let session={room:null,token:null,player:null,version:null,state:null},pollTimer=null,selected=new Set(),busy=false;
const API=location.pathname;
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
async function post(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({error:'Errore di rete'}));if(!r.ok)throw new Error(j.error||'Errore');return j}
function saveSession(){if(session.room&&session.token)localStorage.setItem('sf_'+session.room,session.token);localStorage.setItem('sf_last_room',session.room||'')}
function roomFromUrl(){return new URLSearchParams(location.search).get('room')?.toUpperCase()||''}
function shareUrl(){return location.origin+location.pathname+'?room='+session.room}
function showError(msg){const e=$('#globalError');if(e){e.textContent=msg;e.classList.remove('hidden')}else alert(msg)}
function colorName(c){return c==='red'?'Rossa':'Verde'}function speedLabel(s){return s==='base'?'Base':s==='response'?'Risposta':'Istantanea'}
function renderLanding(){const room=roomFromUrl();app.innerHTML='<div class="wrap"><div class="landing panel"><div class="brand">Champion of the Souls</div><h1>Online Playtest</h1><div class="sub">Starter Rosso/Verde • 2 giocatori • stanze private con codice</div><div id="globalError" class="error hidden"></div><div class="landing-grid"><div><h3>Crea partita</h3><div class="field"><label>Nome</label><input id="createName" maxlength="24" placeholder="Il tuo nome"></div><button class="btn primary" id="createBtn">Crea stanza</button></div><div><h3>Entra in una stanza</h3><div class="field"><label>Nome</label><input id="joinName" maxlength="24" placeholder="Il tuo nome"></div><div class="field"><label>Codice</label><input id="joinRoom" maxlength="6" value="'+esc(room)+'" placeholder="ABC123"></div><button class="btn green" id="joinBtn">Entra</button></div></div><div class="notice" style="margin-top:18px"><b>Starter attuale:</b> Kael + Lyrandel, 18 carte e 12 Mostri.</div></div></div>';
 $('#createBtn').onclick=async()=>{try{busy=true;loadSession(await post({action:'create',name:$('#createName').value}))}catch(e){showError(e.message)}finally{busy=false}};
 $('#joinBtn').onclick=async()=>{try{busy=true;loadSession(await post({action:'join',roomCode:$('#joinRoom').value,name:$('#joinName').value}))}catch(e){showError(e.message)}finally{busy=false}};
}
function loadSession(j){session.room=j.roomCode;session.token=j.token;session.player=j.player;session.version=j.version;session.state=j.state;saveSession();history.replaceState(null,'','?room='+session.room);selected.clear();render();startPolling()}
async function refresh(){if(!session.room||!session.token||busy)return;try{const j=await post({action:'get',roomCode:session.room,token:session.token});session.player=j.player;session.version=j.version;session.state=j.state;render()}catch(e){if(e.message.includes('Token')){localStorage.removeItem('sf_'+session.room);session={room:null,token:null,player:null,version:null,state:null};stopPolling();renderLanding()}}}
function startPolling(){stopPolling();pollTimer=setInterval(refresh,900)}function stopPolling(){if(pollTimer)clearInterval(pollTimer)}
async function move(m){if(busy)return;busy=true;try{const j=await post({action:'move',roomCode:session.room,token:session.token,version:session.version,move:m});session.version=j.version;session.state=j.state;render()}catch(e){if(e.message==='STATE_CONFLICT')await refresh();else showError(e.message)}finally{busy=false}}
function playerState(p){return session.state.players[String(p)]}function otherP(){return session.player===1?2:1}
function canAttack(c){const s=session.state;return s.status==='main'&&s.focus===session.player&&!s.priority&&!s.combat&&!s.stack.length&&!s.pendingChoice&&!c.tapped&&!c.defeated}
function soulsHtml(pl){return '<div class="souls"><div class="soul red">'+pl.souls.red+'</div><div class="soul green">'+pl.souls.green+'</div></div>'}
function champHtml(c,owner,isOwn){if(!c)return'';const wounds=c.wounds||0;return '<div class="champ '+c.color+(c.defeated?' defeated':'')+'"><div class="tap '+(!c.tapped&&!c.defeated?'active':'')+'">'+(c.defeated?'SCONFITTO':c.tapped?'TAPPATO':'ATTIVO')+'</div><h3>'+esc(c.name)+'</h3><div class="stats"><span class="stat">POW <b>'+c.pow+'</b></span><span class="stat">HP <b>'+(c.hp-wounds)+'</b>/'+c.hp+'</span><span class="stat">Danni <b>'+c.damage+'</b>/'+c.pow+'</span></div>'+(isOwn&&!c.defeated?'<div class="card-actions"><button class="btn red attackBtn" data-champ="'+c.id+'" '+(!canAttack(c)?'disabled':'')+'>Attacca</button></div>':'')+'</div>'}
function monsterHtml(m){return '<div class="monster '+m.color+'"><h4>'+esc(m.name)+'</h4><div class="stats"><span class="stat">POW '+m.pow+'</span><span class="stat">Danni '+m.damage+'/'+m.pow+'</span></div></div>'}
function canCast(card){const s=session.state;if(s.status!=='main'||s.pendingChoice)return false;const me=playerState(session.player);if(me.souls[card.color]<(card.effectiveCost??card.cost))return false;if(card.effect==='taglio'&&!s.combat)return false;if(card.effect==='marea'&&!s.combat)return false;if(s.stack.length)return s.priority===session.player&&card.speed==='instant';if(s.combat)return s.priority===session.player&&card.speed==='response';return s.focus===session.player}
function cardHtml(card,selectMode=false){const chosen=selected.has(card.id);return '<div class="card '+card.color+(chosen?' selected':'')+'" data-card="'+card.id+'"><div class="cost">'+(card.effectiveCost??card.cost)+'</div><h4>'+esc(card.name)+'</h4><div class="tag">'+esc(card.type)+' • '+speedLabel(card.speed)+'</div><div class="text">'+esc(card.text)+'</div>'+(selectMode?'<div class="card-actions"><button class="btn '+(chosen?'gold':'ghost')+' selectCard" data-card="'+card.id+'">'+(chosen?'Scelta':'Scegli')+'</button></div>':'<div class="card-actions"><button class="btn '+(card.color==='red'?'red':'green')+' playCard" data-card="'+card.id+'" '+(!canCast(card)?'disabled':'')+'>Gioca</button></div>')+'</div>'}
function chainHtml(){const s=session.state;if(!s.stack.length)return '<div class="tiny">Nessuna Catena.</div>';return '<div class="chain">'+[...s.stack].reverse().map((x,i)=>'<div class="chainitem">#'+(s.stack.length-i)+' '+esc(s.cardDefs[x.cardId]?.name||x.effectName||'Effetto')+' — '+esc(playerState(x.actor)?.name)+(x.targetSummary?'<div class="tiny"><b>Bersagli:</b> '+esc(x.targetSummary)+'</div>':'')+'</div>').join('')+'</div>'}
function combatHtml(){const c=session.state.combat;if(!c)return'';const atk=playerState(c.attacker.player).champions.find(x=>x.id===c.attacker.champId);let target='';if(c.target.type==='champion'){const tc=playerState(c.target.player).champions.find(x=>x.id===c.target.champId);target=tc?.name||'Campione'}else target=session.state.board.monsters.find(x=>x.uid===c.target.uid)?.name||'Mostro';return '<div class="combat"><b>Combattimento:</b> '+esc(atk?.name)+' → '+esc(target)+(c.cancelled?' <b>(annullato)</b>':'')+'</div>'}
function renderSelect(){const me=playerState(session.player);if(me.selected)return '<div class="panel"><h2>Selezione confermata</h2><p>Attendo l’altro giocatore.</p></div>';return '<div class="panel"><div class="select-head"><h2>Scegli 6 carte</h2><b>'+selected.size+'/6</b></div><div class="cards">'+(me.deckCards||[]).map(c=>cardHtml(c,true)).join('')+'</div><div class="controls"><button id="confirmSelect" class="btn primary" '+(selected.size!==6?'disabled':'')+'>Conferma 6 carte</button></div></div>'}
function renderMain(){const s=session.state,me=playerState(session.player),op=playerState(otherP());return '<div class="game-grid"><main><div class="panel playerzone"><div class="playerinfo"><b>'+esc(op.name)+'</b><div class="sub">Mano: '+op.handCount+' • Deck: '+op.deckCount+'</div>'+soulsHtml(op)+'</div><div class="champions">'+op.champions.map(c=>champHtml(c,otherP(),false)).join('')+'</div></div><div class="board"><h3>Campo dei Mostri ('+s.board.monsters.length+')</h3><div class="monsters">'+s.board.monsters.map(monsterHtml).join('')+'</div></div><div class="panel playerzone"><div class="playerinfo"><b>'+esc(me.name)+'</b>'+soulsHtml(me)+'</div><div class="champions">'+me.champions.map(c=>champHtml(c,session.player,true)).join('')+'</div></div><div class="hand-title"><h3>La tua mano ('+me.handCards.length+')</h3><div class="controls">'+mainControls()+'</div></div><div class="cards">'+me.handCards.map(c=>cardHtml(c,false)).join('')+'</div></main><aside class="side"><div class="panel">'+combatHtml()+chainHtml()+'</div><div class="panel"><h3>Log</h3><div class="log">'+[...s.log].reverse().map(x=>'<div>'+esc(x)+'</div>').join('')+'</div></div></aside></div>'}
function mainControls(){const s=session.state,me=playerState(session.player);let html='';if(s.priority===session.player)html+='<button id="passPriority" class="btn gold">Passa priorità</button>';else if(!s.priority&&s.focus===session.player)html+='<button id="passMain" class="btn gold">Passa</button>';const cost=me.recycleCount+1;if(!s.priority&&s.focus===session.player&&me.graveCards.length)html+='<button id="recycleBtn" class="btn ghost">Ricicla ('+cost+')</button>';return html||'<span class="sub">Attendi l’avversario…</span>'}
function turnHeadline(s){
 if(s.status==='waiting')return{text:'IN ATTESA DI UN AVVERSARIO',tone:'wait'};
 if(s.status==='select'){
  const me=playerState(session.player),done=!!me?.selected;
  return{text:done?'ATTENDI L’AVVERSARIO':'SCEGLI LE TUE CARTE',tone:done?'opponent':'mine'};
 }
 if(s.status==='gameover')return{text:s.winner===session.player?'HAI VINTO':'HAI PERSO',tone:s.winner===session.player?'mine':'opponent'};
 if(s.pendingChoice?.player===session.player)return{text:'FAI LA TUA SCELTA',tone:'focus'};
 if(s.priority)return Number(s.priority)===Number(session.player)
  ?{text:'HAI LA PRIORITÀ',tone:'focus'}
  :{text:'PRIORITÀ AVVERSARIA',tone:'opponent'};
 const mine=Number(s.focus)===Number(session.player);
 if(mine&&Number(s.mainPasses||0)>=1)return{text:'PUOI FINIRE IL TURNO',tone:'end'};
 const starter=Number(s.startingPlayer)===2?2:1;
 const turnOwner=Number(s.turn||1)%2===1?starter:(starter===1?2:1);
 if(mine&&turnOwner===Number(session.player))return{text:'È IL TUO TURNO',tone:'mine'};
 if(mine)return{text:'HAI IL FOCUS',tone:'focus'};
 if(turnOwner===Number(session.player))return{text:'FOCUS AVVERSARIO',tone:'opponent'};
 return{text:'TURNO AVVERSARIO',tone:'opponent'};
}
function renderGame(){const s=session.state,headline=turnHeadline(s),me=playerState(session.player),focusName=s.focus?playerState(s.focus)?.name:'—',priorityName=s.priority?playerState(s.priority)?.name:'—';app.innerHTML='<div class="wrap"><div class="top"><div><div class="brand sf-turn-headline '+headline.tone+'">'+headline.text+'</div><div class="sub">Stanza <b>'+session.room+'</b> • '+esc(me.name)+'</div></div><div class="statusbar"><span class="pill">Turno '+s.turn+'</span><span class="pill '+(s.focus===session.player?'focus':'')+'">Focus: '+esc(focusName)+'</span>'+(s.priority?'<span class="pill">Priorità: '+esc(priorityName)+'</span>':'')+'<button class="btn ghost" id="shareBtn">Condividi stanza</button></div></div><div id="globalError" class="error hidden"></div>'+(s.status==='waiting'?'<div class="panel"><h2>In attesa di un avversario</h2><div class="notice">'+esc(shareUrl())+'</div></div>':s.status==='select'?renderSelect():s.status==='gameover'?'<div class="panel"><h1>'+(s.winner===session.player?'Hai vinto':'Hai perso')+'</h1></div>':renderMain())+'<div class="footer">Playtest online</div></div>';$('#shareBtn')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(shareUrl());$('#shareBtn').textContent='Copiato'}catch{prompt('Copia il link:',shareUrl())}});bind();if(s.pendingChoice&&s.pendingChoice.player===session.player&&!s.pendingChoice.hidden&&s.pendingChoice.type==='festa')showFestaChoice(s.pendingChoice.top)}
function bind(){document.querySelectorAll('.selectCard').forEach(b=>b.onclick=()=>{const id=b.dataset.card;if(selected.has(id))selected.delete(id);else if(selected.size<6)selected.add(id);render()});$('#confirmSelect')?.addEventListener('click',()=>move({type:'select_cards',cardIds:[...selected]}));document.querySelectorAll('.playCard').forEach(b=>b.onclick=()=>chooseForCard(b.dataset.card));document.querySelectorAll('.attackBtn').forEach(b=>b.onclick=()=>chooseAttack(b.dataset.champ));$('#passPriority')?.addEventListener('click',()=>move({type:'pass_priority'}));$('#passMain')?.addEventListener('click',()=>move({type:'pass'}));$('#recycleBtn')?.addEventListener('click',showRecycle)}
function render(){if(!session.state)return renderLanding();renderGame()}
function closeModal(){modal.innerHTML=''}function showModal(title,body){modal.innerHTML='<div class="modal"><div class="modalbox"><h3>'+esc(title)+'</h3>'+body+'<div class="controls"><button class="btn ghost" id="modalCancel">Annulla</button></div></div></div>';$('#modalCancel').onclick=closeModal}
function ownChampTargets(){return playerState(session.player).champions.filter(c=>!c.defeated)}function enemyChampTargets(){return playerState(otherP()).champions.filter(c=>!c.defeated)}function monsterTargets(){return session.state.board.monsters}
function targetButtons(items){return '<div class="target-grid">'+items.map((x,i)=>'<button class="target" data-i="'+i+'"><b>'+esc(x.label)+'</b><div class="tiny">'+esc(x.desc||'')+'</div></button>').join('')+'</div>'}
function pick(title,items){return new Promise(resolve=>{showModal(title,targetButtons(items));document.querySelectorAll('.target').forEach(b=>b.onclick=()=>{const v=items[Number(b.dataset.i)].value;closeModal();resolve(v)});$('#modalCancel').onclick=()=>{closeModal();resolve(null)}})}
async function chooseForCard(id){const card=playerState(session.player).handCards.find(c=>c.id===id);if(!card)return;let targets={};try{if(['corazza','mano','occhio','berserk','katana','albero','mille'].includes(card.effect)){const c=await pick('Scegli un tuo Campione',ownChampTargets().map(x=>({label:x.name,value:x.id})));if(!c)return;targets.ownChamp=c}else if(card.effect==='marea'){const c=await pick('Scegli il tuo Campione',ownChampTargets().map(x=>({label:x.name,value:x.id})));if(!c)return;targets.ownChamp=c}else if(['stupido','taglio_ninjitsu','sguardo'].includes(card.effect)){const m=await pick('Scegli un Mostro',monsterTargets().map(x=>({label:x.name,desc:'POW '+x.pow,value:x.uid})));if(!m)return;targets.monsterUid=m}else if(card.effect==='riflesso'){const c=await pick('Scegli un tuo Campione',ownChampTargets().map(x=>({label:x.name,value:x.id})));if(!c)return;const m=await pick('Scegli un Mostro',monsterTargets().map(x=>({label:x.name,value:x.uid})));if(!m)return;targets={ownChamp:c,monsterUid:m}}else if(card.effect==='sfera'){const enemies=[...enemyChampTargets().map(x=>({label:x.name,value:{type:'champion',player:otherP(),champId:x.id}})),...monsterTargets().map(x=>({label:x.name,value:{type:'monster',uid:x.uid}}))];const e=await pick('Scegli un nemico',enemies);if(!e)return;const c=await pick('Scegli un tuo Campione',ownChampTargets().map(x=>({label:x.name,value:x.id})));if(!c)return;targets={enemy:e,ownChamp:c}}else if(card.effect==='fendente'){const enemies=[...enemyChampTargets().map(x=>({label:x.name,value:{type:'champion',player:otherP(),champId:x.id}})),...monsterTargets().map(x=>({label:x.name,value:{type:'monster',uid:x.uid}}))];const e=await pick('Scegli un nemico',enemies);if(!e)return;targets.enemy=e}await move({type:'cast',cardId:id,targets})}catch(e){showError(e.message)}}
async function chooseAttack(champId){const targets=[...enemyChampTargets().map(x=>({label:x.name,value:{type:'champion',player:otherP(),champId:x.id}})),...monsterTargets().map(x=>({label:x.name,desc:'Mostro • POW '+x.pow,value:{type:'monster',uid:x.uid}}))];const t=await pick('Scegli il bersaglio',targets);if(t)move({type:'attack',champId,target:t})}
function showRecycle(){const me=playerState(session.player),cost=me.recycleCount+1;showModal('Riciclo — costo '+cost,'<div class="field"><label>Anime Rosse</label><input id="payRed" type="number" min="0" max="'+me.souls.red+'" value="'+Math.min(cost,me.souls.red)+'"></div><div class="field"><label>Anime Verdi</label><input id="payGreen" type="number" min="0" max="'+me.souls.green+'" value="'+Math.max(0,cost-Math.min(cost,me.souls.red))+'"></div><button class="btn primary" id="doRecycle">Ricicla</button>');$('#doRecycle').onclick=()=>{const r=Number($('#payRed').value),g=Number($('#payGreen').value);closeModal();move({type:'recycle',red:r,green:g})}}
function showFestaChoice(top){let order=[...top],discard=new Set();const defs=session.state.monsterDefs;function draw(){const rows=order.map((id,i)=>'<div class="choice-row"><div><b>'+esc(defs[id]?.name||id)+'</b><div class="tiny">POW '+defs[id]?.pow+'</div></div><div class="controls"><button class="btn ghost disc" data-id="'+id+'">'+(discard.has(id)?'Recupera':'Scarta')+'</button><button class="btn ghost up" data-i="'+i+'">↑</button><button class="btn ghost down" data-i="'+i+'">↓</button></div></div>').join('');modal.innerHTML='<div class="modal"><div class="modalbox"><h3>Tutto per la Festa</h3>'+rows+'<button class="btn primary" id="finishFesta">Conferma</button></div></div>';document.querySelectorAll('.disc').forEach(b=>b.onclick=()=>{const id=b.dataset.id;discard.has(id)?discard.delete(id):discard.add(id);draw()});document.querySelectorAll('.up').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);if(i>0){[order[i-1],order[i]]=[order[i],order[i-1]];draw()}});document.querySelectorAll('.down').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);if(i<order.length-1){[order[i+1],order[i]]=[order[i],order[i+1]];draw()}});$('#finishFesta').onclick=()=>{const remain=order.filter(id=>!discard.has(id));closeModal();move({type:'resolve_choice',discard:[...discard],order:remain})}}draw()}
(async function init(){const room=roomFromUrl();if(room){const tok=localStorage.getItem('sf_'+room);if(tok){session.room=room;session.token=tok;try{const j=await post({action:'get',roomCode:room,token:tok});session.player=j.player;session.version=j.version;session.state=j.state;render();startPolling();return}catch{}}}renderLanding()})();
</script></body></html>
